# Workflow for checking Hugo site builds on pull requests
name: PR Build Check

on:
  pull_request:
    branches: ["master"]

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0  # Full history for compute_completion_status.py
      - name: Fetch master branch
        run: git fetch origin master
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Run tests
        # No tests are committed yet; run them as soon as a tests/ directory exists.
        run: |
          if [ -d tests ]; then
            uv run python -m unittest discover -s tests -v
          else
            echo "No tests/ directory, skipping."
          fi
      - name: Generate data files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run tools/generate_github_stars.py --provider github
          uv run tools/merge_vcpkg_package_list_progress.py
          uv run tools/compute_completion_status.py
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        # To test locally: python -m http.server 8000 --directory public
        run: |
          hugo \
            --minify \
            --baseURL "http://localhost:8000/"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-site-preview
          path: ./public
          retention-days: 7
